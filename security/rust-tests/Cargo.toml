[package]
name = "save-sync-auth-core-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
fastrand = "2"
sha2 = "0.10"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
